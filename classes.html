<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC DOCUMENT SETTINGS
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="description"
        content="Choose your GSEB class from Class 6 to Class 10 and access subject-wise study material, notes, assignments, and PDF resources for Maths, Science, English, Gujarati and Sanskrit."
    >

    <meta
        name="robots"
        content="index, follow"
    >


    <!-- =========================================
         TITLE
    ========================================== -->

    <title>
        Gulu PDF Library | Select Class
    </title>


    <!-- =========================================
         STYLESHEET
    ========================================== -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >


    <!-- =========================================
         FAVICON
    ========================================== -->

    <link
        rel="icon"
        type="image/png"
        href="./logo.png"
    >

</head>


<body>


<!-- =========================================
     CLASS PAGE
========================================== -->

<div class="class-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="class-header">


        <div>

            <!-- BRAND -->

            <div class="class-brand">

                <span class="class-crown">
                    ♕
                </span>

                <span class="class-gulu">
                    Gulu
                </span>

            </div>


            <!-- TITLE -->

            <h1>
                CHOOSE YOUR CLASS
            </h1>


            <p>
                Browse GSEB study resources and PDF materials by class
            </p>

        </div>

    </header>



    <!-- =====================================
         TOP INFORMATION
    ====================================== -->

    <section class="class-top">

        <div>

            <h2>
                Available Classes
            </h2>

            <p>
                Select your class to continue
            </p>

        </div>


        <!-- CLASS COUNT -->

        <div class="class-count">

            <strong id="classCount">
                0
            </strong>

            Classes

        </div>

    </section>



    <!-- =====================================
         CLASS GRID
    ====================================== -->

    <main>

        <div
            class="class-grid"
            id="classGrid"
        ></div>

    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="class-footer">

        <div class="class-footer-inner">

            <div>
                Secure PDF Library
            </div>

            <div>
                Created by
                <strong>
                    Gulshan
                </strong>
            </div>

        </div>

    </footer>


</div>



<!-- =========================================
     LIBRARY DATA
========================================== -->

<script src="./js/library-data.js"></script>
<script src="./js/script.js"></script>


<!-- =========================================
     CLASS PAGE SCRIPT
========================================== -->

<script>

    /* =========================================
       GET ELEMENTS
    ========================================== */

    const classGrid =
        document.getElementById("classGrid");


    const classCount =
        document.getElementById("classCount");



    /* =========================================
       CHECK LIBRARY DATA
    ========================================== */

    if (
        typeof LIBRARY_DATA === "undefined"
    ) {

        classGrid.innerHTML = `
            <div
                style="
                    grid-column: 1 / -1;
                    padding: 30px;
                    text-align: center;
                    color: #ff7777;
                    border: 1px solid rgba(255,100,100,0.25);
                    border-radius: 16px;
                    background: rgba(255,80,80,0.05);
                "
            >
                Unable to load class data.
            </div>
        `;

    }

    else {


        /* =====================================
           GET CLASSES
        ====================================== */

        const classes =
            Object.entries(LIBRARY_DATA);



        /* =====================================
           UPDATE CLASS COUNT
        ====================================== */

        classCount.textContent =
            classes.length;



        /* =====================================
           SELECT CLASS
        ====================================== */

        function selectClass(className) {

            /*
             * Save selected class
             */

            sessionStorage.setItem(
                "selectedClass",
                className
            );


            /*
             * Clear previous subject selection
             */

            sessionStorage.removeItem(
                "selectedSubject"
            );


            /*
             * Clear previous unlock state
             */

            sessionStorage.removeItem(
                "subjectUnlocked"
            );


            /*
             * Open subject/library page
             */

            window.location.href =
                "library.html";

        }



        /* =====================================
           CREATE CLASS CARD
        ====================================== */

        classes.forEach(
            function ([classKey, classInfo]) {


                /* CREATE CARD */

                const card =
                    document.createElement("div");


                card.className =
                    "class-card";


                /* ACCESSIBILITY */

                card.setAttribute(
                    "role",
                    "button"
                );


                card.setAttribute(
                    "tabindex",
                    "0"
                );


                card.setAttribute(
                    "aria-label",
                    "Select " + classInfo.name
                );



                /* =================================
                   CLASS NUMBER
                ================================== */

                const classNumber =
                    classInfo.name
                        .replace("Class ", "");



                /* =================================
                   CARD CONTENT
                ================================== */

                card.innerHTML = `

                    <div class="class-number">

                        ${classNumber}

                    </div>


                    <div class="class-info">

                        <h3>
                            ${classInfo.name}
                        </h3>


                        <p>

                            ${classInfo.fullName}
                            notes, chapters,
                            practice material
                            and PDF documents.

                        </p>


                        <span class="class-status">
                            Available
                        </span>

                    </div>


                    <span class="class-arrow">
                        →
                    </span>

                `;



                /* =================================
                   MOUSE CLICK
                ================================== */

                card.addEventListener(
                    "click",
                    function () {

                        selectClass(
                            classKey
                        );

                    }
                );



                /* =================================
                   KEYBOARD ACCESS
                ================================== */

                card.addEventListener(
                    "keydown",
                    function (event) {


                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();


                            selectClass(
                                classKey
                            );

                        }

                    }
                );



                /* =================================
                   ADD CARD
                ================================== */

                classGrid.appendChild(
                    card
                );

            }
        );

    }

</script>



<!-- =========================================
     BACKGROUND MUSIC
========================================== -->

<script src="./js/bg-music.js"></script>


</body>

</html>
