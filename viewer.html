<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gulu PDF Viewer
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            background: #111827;

            overflow: hidden;
        }


        #pdfViewer {

            width: 100%;
            height: 100%;

            border: none;
        }

    </style>

</head>


<body>


<iframe
    id="pdfViewer"
    title="PDF Viewer"
></iframe>



<script src="js/script.js"></script>


<script>

    // --------------------------------
    // LOGIN PROTECTION
    // --------------------------------

    protectPage();


    // --------------------------------
    // GET PDF FROM URL
    // --------------------------------

    const params =
        new URLSearchParams(
            window.location.search
        );


    const file =
        params.get("file");


    const viewer =
        document.getElementById(
            "pdfViewer"
        );


    // --------------------------------
    // OPEN PDF
    // --------------------------------

    if (file) {

        viewer.src = file;

    }

    else {

        window.location.replace(
            "library.html"
        );

    }

</script>


</body>

</html>
