<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>Gulu | PDF Viewer</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>

        /* =========================================
           VIEWER PAGE
        ========================================= */

        .viewer-page {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    135deg,
                    #050b14,
                    #0b1728
                );

            overflow: hidden;
        }


        /* =========================================
           VIEWER HEADER
        ========================================= */

        .viewer-header {

            height: 68px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            background:
                rgba(7, 17, 31, 0.96);

            border-bottom:
                1px solid
                rgba(255,255,255,0.09);

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.30);

            z-index: 10;
        }


        /* =========================================
           LEFT SIDE
        ========================================= */

        .viewer-left {

            display: flex;

            align-items: center;

            gap: 14px;

            min-width: 0;
        }


        .back-btn {

            height: 42px;

            padding: 0 15px;

            border:
                1px solid
                rgba(82,154,230,0.30);

            border-radius: 10px;

            background:
                rgba(255,255,255,0.06);

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .back-btn:hover {

            background:
                rgba(37,111,210,0.25);

            border-color:
                rgba(82,154,230,0.65);

            transform:
                translateY(-1px);
        }


        /* =========================================
           BRAND
        ========================================= */

        .viewer-brand {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .viewer-brand-crown {

            color: #1590ff;

            font-size: 27px;

            text-shadow:
                0 0 15px
                rgba(21,144,255,0.55);
        }


        .viewer-brand-name {

            color: #1590ff;

            font-size: 25px;

            font-weight: 800;

            font-style: italic;

            letter-spacing: -1px;
        }


        /* =========================================
           DOCUMENT NAME
        ========================================= */

        .viewer-title {

            color: #9aabc0;

            font-size: 13px;

            max-width: 360px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================================
           RIGHT SIDE
        ========================================= */

        .viewer-status {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #7f92a9;

            font-size: 12px;
        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #35d18a;

            box-shadow:
                0 0 10px
                rgba(53,209,138,0.65);
        }


        /* =========================================
           PDF AREA
        ========================================= */

        .viewer-content {

            flex: 1;

            position: relative;

            background: #111827;

            overflow: hidden;
        }


        #pdfViewer {

            width: 100%;
            height: 100%;

            display: block;

            border: none;

            background: #111827;
        }


        /* =========================================
           LOADING SCREEN
        ========================================= */

        .viewer-loading {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 12px;

            background:
                #0b1422;

            color: #8ca0b7;

            z-index: 2;

            pointer-events: none;

            transition:
                opacity 0.3s ease;
        }


        .loading-spinner {

            width: 35px;
            height: 35px;

            border:
                3px solid
                rgba(255,255,255,0.12);

            border-top-color:
                #2495ff;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        .viewer-loading.hidden {

            opacity: 0;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .viewer-header {

                height: 60px;

                padding: 0 12px;

            }


            .back-btn {

                height: 38px;

                padding: 0 11px;

                font-size: 13px;

            }


            .viewer-brand-name {

                font-size: 20px;

            }


            .viewer-brand-crown {

                font-size: 22px;

            }


            .viewer-title {

                display: none;

            }


            .viewer-status {

                font-size: 10px;

            }

        }

    </style>

</head>


<body>


<div class="viewer-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="viewer-header">


        <!-- LEFT -->

        <div class="viewer-left">


            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back
            </button>


            <div class="viewer-brand">

                <span class="viewer-brand-crown">
                    ♕
                </span>

                <span class="viewer-brand-name">
                    Gulu
                </span>

            </div>


            <div
                class="viewer-title"
                id="documentTitle"
            >
                PDF Document
            </div>

        </div>


        <!-- RIGHT -->

        <div class="viewer-status">

            <span class="status-dot"></span>

            Online Reading

        </div>


    </header>



    <!-- =====================================
         PDF CONTENT
    ====================================== -->

    <main class="viewer-content">


        <div
            class="viewer-loading"
            id="loadingScreen"
        >

            <div class="loading-spinner"></div>

            <div>
                Loading document...
            </div>

        </div>


        <iframe
            id="pdfViewer"
            title="Gulu PDF Viewer"
        ></iframe>


    </main>


</div>



<!-- =====================================
     MAIN JS
====================================== -->

<script src="js/script.js"></script>


<script>

    /* =====================================
       PROTECT PAGE
    ===================================== */

    protectPage();


    /* =====================================
       READ PDF FILE
    ===================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const file =
        params.get("file");


    const viewer =
        document.getElementById(
            "pdfViewer"
        );


    const title =
        document.getElementById(
            "documentTitle"
        );


    const loading =
        document.getElementById(
            "loadingScreen"
        );


    /* =====================================
       CHECK FILE
    ===================================== */

    if (!file) {

        window.location.replace(
            "library.html"
        );

    }

    else {

        /* Show filename in header */

        const cleanName =
            decodeURIComponent(file)
            .split("/")
            .pop()
            .replace(".pdf", "")
            .replaceAll("_", " ");

        title.textContent =
            cleanName;


        /* Open PDF */

        viewer.src =
            file;


        /* Hide loading screen */

        viewer.addEventListener(
            "load",
            function () {

                loading.classList.add(
                    "hidden"
                );

            }
        );

    }


    /* =====================================
       BACK BUTTON
    ===================================== */

    function goBack() {

        window.location.href =
            "library.html";

    }

</script>

<script src="js/bg-music.js"></script>


</body>

</html>
