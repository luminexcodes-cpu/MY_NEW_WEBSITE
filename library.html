<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>
        Gulu PDF Library
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>

        .selected-class-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 10px;

            padding: 7px 12px;

            border-radius: 20px;

            border:
                1px solid
                rgba(74,151,235,0.28);

            background:
                rgba(42,127,216,0.11);

            color: #8cbfff;

            font-size: 12px;

            font-weight: 600;
        }


        .selected-class-badge .dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #35d18a;

            box-shadow:
                0 0 9px
                rgba(53,209,138,0.65);
        }


        .library-actions {

            display: flex;

            align-items: center;

            gap: 10px;

            flex-shrink: 0;
        }


        .change-class-btn {

            padding:
                12px 18px;

            border:
                1px solid
                rgba(74,151,235,0.30);

            border-radius: 10px;

            background:
                rgba(255,255,255,0.045);

            color: #a9c8e8;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;
        }


        .change-class-btn:hover {

            background:
                rgba(37,111,210,0.18);

            border-color:
                rgba(90,160,235,0.70);

            color: white;

            transform:
                translateY(-2px);
        }


        .library-top-class {

            color: #55aaff;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.7px;

            text-transform: uppercase;

            margin-bottom: 7px;
        }


        @media (max-width: 600px) {

            .library-actions {

                width: 100%;

                display: grid;

                grid-template-columns: 1fr 1fr;

                gap: 10px;
            }


            .change-class-btn,
            .logout-btn {

                width: 100%;
            }

        }


        @media (max-width: 400px) {

            .library-actions {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="library-page">


    <!-- HEADER -->

    <header class="library-header">

        <div>

            <div class="library-brand">

                <span class="library-crown">
                    ♕
                </span>

                <span class="library-gulu">
                    Gulu
                </span>

            </div>


            <h1>
                WELCOME MERE DOSTO
            </h1>


            <p>
                Your personal study library
            </p>


            <div class="selected-class-badge">

                <span class="dot"></span>

                <span id="selectedClassText">
                    Class
                </span>

            </div>

        </div>


        <div class="library-actions">

            <button
                class="change-class-btn"
                id="changeClassBtn"
                type="button"
            >
                ⇄ Change Class
            </button>


            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- TOP -->

    <div class="library-top">

        <div>

            <div
                class="library-top-class"
                id="classHeading"
            >
                CLASS
            </div>


            <h2>
                Study Subjects
            </h2>


            <p>
                Select a subject to explore your documents
            </p>

        </div>


        <div class="document-count">

            <strong id="subjectCount">
                0
            </strong>

            Subjects

        </div>

    </div>



    <!-- SUBJECTS -->

    <main>

        <div
            class="subject-grid"
            id="subjectGrid"
        ></div>

    </main>



    <!-- FOOTER -->

    <footer class="library-footer">

        <div>
            Secure PDF Library
        </div>

        <div class="footer-credit">
            Created by <strong>Gulshan</strong>
        </div>

    </footer>


</div>



<!-- DATA -->

<script src="js/library-data.js"></script>


<!-- MAIN SCRIPT -->

<script src="js/script.js"></script>


<script>

    /* =====================================
       PROTECT
    ====================================== */

    protectPage();



    /* =====================================
       SELECTED CLASS
    ====================================== */

    const selectedClass =
        sessionStorage.getItem(
            "selectedClass"
        );


    if (
        !selectedClass ||
        !LIBRARY_DATA[selectedClass]
    ) {

        sessionStorage.removeItem(
            "selectedSubject"
        );

        sessionStorage.removeItem(
            "subjectUnlocked"
        );

        window.location.replace(
            "classes.html"
        );

    }


    const currentClass =
        LIBRARY_DATA[selectedClass];



    /* =====================================
       CLASS DISPLAY
    ====================================== */

    document.getElementById(
        "selectedClassText"
    ).textContent =
        currentClass.fullName;


    document.getElementById(
        "classHeading"
    ).textContent =
        currentClass.name;



    /* =====================================
       SUBJECT GRID
    ====================================== */

    const subjectGrid =
        document.getElementById(
            "subjectGrid"
        );


    const subjectCount =
        document.getElementById(
            "subjectCount"
        );


    const subjects =
        Object.entries(
            currentClass.subjects
        );


    subjectCount.textContent =
        subjects.length;



    /* =====================================
       SUBJECT PASSWORD
    ====================================== */

    function askSubjectPassword(subjectKey) {

        const subject =
            currentClass.subjects[subjectKey];


        if (!subject) {
            return;
        }


        const password =
            prompt(
                "Enter subject password:"
            );


        if (password === null) {
            return;
        }


        if (
            password ===
            subject.password
        ) {

            sessionStorage.setItem(
                "selectedSubject",
                subjectKey
            );


            sessionStorage.setItem(
                "subjectUnlocked",
                "true"
            );


            window.location.replace(
                "subject.html?subject=" +
                encodeURIComponent(
                    subjectKey
                )
            );

        }

        else {

            alert(
                "Incorrect password. Access denied."
            );

        }

    }



    /* =====================================
       CREATE SUBJECT CARDS
    ====================================== */

    subjects.forEach(
        function ([subjectKey, subject]) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "subject-card";


            card.setAttribute(
                "role",
                "button"
            );


            card.setAttribute(
                "tabindex",
                "0"
            );


            card.innerHTML = `

                <div class="subject-icon ${getSubjectIconClass(subjectKey)}">
                    ${getSubjectIcon(subjectKey)}
                </div>


                <div class="subject-info">

                    <h3>
                        ${subject.title}
                    </h3>

                    <p>
                        ${subject.subtitle}
                    </p>

                </div>


                <span class="subject-arrow">
                    →
                </span>

            `;


            card.addEventListener(
                "click",
                function () {

                    askSubjectPassword(
                        subjectKey
                    );

                }
            );


            card.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        askSubjectPassword(
                            subjectKey
                        );

                    }

                }
            );


            subjectGrid.appendChild(
                card
            );

        }
    );



    /* =====================================
       SUBJECT ICON
    ====================================== */

    function getSubjectIconClass(
        subjectKey
    ) {

        const classes = {

            english:
                "english-icon",

            maths:
                "maths-icon",

            science:
                "science-icon",

            "Social-science":
                "social-icon",

            gujarati:
                "gujarati-icon",

            sanskrit:
                "sanskrit-icon"

        };


        return classes[subjectKey] || "";

    }


    function getSubjectIcon(
        subjectKey
    ) {

        const icons = {

            english:
                "EN",

            maths:
                "∑",

            science:
                "⚛",

            "Social-science":
                "SS",

            gujarati:
                "અ",

            sanskrit:
                "ॐ"

        };


        return icons[subjectKey] || "?";

    }



    /* =====================================
       CHANGE CLASS
    ====================================== */

    document
        .getElementById(
            "changeClassBtn"
        )
        .addEventListener(
            "click",
            function () {

                sessionStorage.removeItem(
                    "selectedClass"
                );


                sessionStorage.removeItem(
                    "selectedSubject"
                );


                sessionStorage.removeItem(
                    "subjectUnlocked"
                );


                window.location.replace(
                    "classes.html"
                );

            }
        );



    /* =====================================
       LOGOUT
    ====================================== */

    document
        .getElementById(
            "logoutBtn"
        )
        .addEventListener(
            "click",
            function () {

                logoutUser();

            }
        );

</script>



<!-- MUSIC -->

<script src="js/bg-music.js"></script>


</body>

</html>
