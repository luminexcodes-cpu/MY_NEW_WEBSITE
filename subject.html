<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="description"
        content="Browse Gulu PDF Library subject documents, chapter notes, and PDF study material for GSEB students across Class 6 to Class 10."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        Gulu | Subject Library
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="./logo.png"
    >

</head>


<body>

<div class="library-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="library-header">

        <div>

            <div class="library-brand">

                <span class="library-crown">
                    ♕
                </span>

                <span class="library-gulu">
                    Gulu
                </span>

            </div>


            <h1 id="subjectTitle">
                Subject Library
            </h1>


            <p id="subjectSubtitle">
                Your study documents and revision material
            </p>


            <div
                style="
                    display:inline-flex;
                    align-items:center;
                    gap:7px;
                    margin-top:10px;
                    padding:7px 12px;
                    border-radius:20px;
                    border:1px solid rgba(74,151,235,0.28);
                    background:rgba(42,127,216,0.11);
                    color:#8cbfff;
                    font-size:12px;
                    font-weight:600;
                "
            >

                <span
                    style="
                        width:7px;
                        height:7px;
                        border-radius:50%;
                        background:#35d18a;
                        box-shadow:0 0 9px rgba(53,209,138,0.65);
                    "
                ></span>

                <span id="classText">
                    Class
                </span>

            </div>

        </div>


        <button
            class="logout-btn"
            id="backSubjectsBtn"
            type="button"
        >
            ← Back to Subjects
        </button>

    </header>



    <!-- =====================================
         DOCUMENT TITLE
    ====================================== -->

    <div class="library-top">

        <div>

            <h2>
                Available Documents
            </h2>

            <p>
                Click a document to read it online
            </p>

        </div>


        <div class="document-count">

            <strong id="pdfCount">
                0
            </strong>

            PDFs

        </div>

    </div>



    <!-- =====================================
         PDF GRID
    ====================================== -->

    <main>

        <div
            id="pdfGrid"
            class="pdf-grid"
        ></div>

    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="library-footer">

        <div>
            Secure PDF Library
        </div>

        <div class="footer-credit">
            Created by <strong>Gulshan</strong>
        </div>

    </footer>


</div>



<!-- =====================================
     DATA
====================================== -->

<script src="./js/library-data.js"></script>


<script>

    /* =====================================
       SELECTED CLASS
    ====================================== */

    const selectedClass =
        sessionStorage.getItem(
            "selectedClass"
        );


    if (
        !selectedClass ||
        typeof LIBRARY_DATA === "undefined" ||
        !LIBRARY_DATA[selectedClass]
    ) {

        sessionStorage.removeItem(
            "selectedSubject"
        );

        sessionStorage.removeItem(
            "subjectUnlocked"
        );

        window.location.replace(
            "classes.html"
        );

    }


    const currentClass =
        LIBRARY_DATA[selectedClass];



    /* =====================================
       GET SUBJECT
    ====================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const subjectKey =
        params.get(
            "subject"
        );



    /* =====================================
       CHECK SUBJECT
    ====================================== */

    const currentSubject =
        currentClass.subjects[
            subjectKey
        ];


    const selectedSubject =
        sessionStorage.getItem(
            "selectedSubject"
        );


    const subjectUnlocked =
        sessionStorage.getItem(
            "subjectUnlocked"
        );


    if (
        !currentSubject ||
        selectedSubject !== subjectKey ||
        subjectUnlocked !== "true"
    ) {

        window.location.replace(
            "library.html"
        );

    }



    /* =====================================
       CLASS / SUBJECT DISPLAY
    ====================================== */

    document.getElementById(
        "classText"
    ).textContent =
        currentClass.fullName;


    document.getElementById(
        "subjectTitle"
    ).textContent =
        currentSubject.title;


    document.getElementById(
        "subjectSubtitle"
    ).textContent =
        currentSubject.subtitle;



    /* =====================================
       PDF ELEMENTS
    ====================================== */

    const pdfGrid =
        document.getElementById(
            "pdfGrid"
        );


    const pdfCount =
        document.getElementById(
            "pdfCount"
        );


    pdfCount.textContent =
        currentSubject.pdfs.length;



    /* =====================================
       NO PDF
    ====================================== */

    if (
        currentSubject.pdfs.length === 0
    ) {

        pdfGrid.innerHTML = `

            <div
                style="
                    grid-column:1 / -1;
                    text-align:center;
                    padding:70px 20px;
                    color:#7f92aa;
                    border:1px solid rgba(255,255,255,0.08);
                    border-radius:18px;
                    background:rgba(255,255,255,0.03);
                "
            >

                <h3
                    style="
                        color:#dbeafe;
                        margin-bottom:10px;
                    "
                >
                    No PDFs yet
                </h3>

                <p>
                    Documents for this subject will appear here.
                </p>

            </div>

        `;

    }



    /* =====================================
       PDF CARDS
    ====================================== */

    else {

        currentSubject.pdfs.forEach(
            function (pdf) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "pdf-card";


                card.setAttribute(
                    "role",
                    "button"
                );


                card.setAttribute(
                    "tabindex",
                    "0"
                );


                card.setAttribute(
                    "aria-label",
                    "Open " + pdf.name
                );


                card.innerHTML = `

                    <div class="pdf-icon">
                        PDF
                    </div>


                    <div class="pdf-info">

                        <h3>
                            ${pdf.name}
                        </h3>

                        <p>
                            Click to read
                        </p>

                    </div>


                    <span class="arrow">
                        →
                    </span>

                `;


                /* CLICK */

                card.addEventListener(
                    "click",
                    function () {

                        openPDF(
                            pdf.file
                        );

                    }
                );


                /* KEYBOARD */

                card.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();

                            openPDF(
                                pdf.file
                            );

                        }

                    }
                );


                pdfGrid.appendChild(
                    card
                );

            }
        );

    }



    /* =====================================
       OPEN PDF
    ====================================== */

    function openPDF(file) {

        window.location.href =
            "viewer.html?file=" +
            encodeURIComponent(
                file
            );

    }



    /* =====================================
       BACK TO SUBJECTS
    ====================================== */

    document
        .getElementById(
            "backSubjectsBtn"
        )
        .addEventListener(
            "click",
            function () {

                window.location.replace(
                    "library.html"
                );

            }
        );

</script>



<!-- =====================================
     BACKGROUND MUSIC
====================================== -->

<script src="./js/bg-music.js"></script>


</body>

</html>
